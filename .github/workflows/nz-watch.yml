name: NZ trip watch

on:
  schedule:
    - cron: '7 * * * *'     # every hour -> full check (cars, deals, relocations, hotels)
  workflow_dispatch:         # lets you press "Run workflow" manually
    inputs:
      mode:
        description: 'all / hotels / test'
        default: 'all'

permissions:
  contents: write            # needed to save state.json (remembers deals already seen)

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Run watch
        env:
          TZ: Asia/Kolkata
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "35 15 * * *" ]; then MODE=hotels; else MODE=all; fi
          fi
          node nz-watch.js "$MODE"
      - name: Save state
        if: always()
        run: |
          git config user.name "nz-watch-bot"
          git config user.email "nz-watch-bot@users.noreply.github.com"
          git add state.json nz-watch.log 2>/dev/null || true
          git commit -m "watch state $(date -u +%F_%H%M)" || echo "no changes"
          git push || echo "push skipped"
